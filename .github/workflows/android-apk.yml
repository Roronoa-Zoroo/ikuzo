name: Android APK

# Builds an installable APK and publishes it as a GitHub pre-release,
# so the app can be downloaded straight onto a phone.
on:
  push:
    branches: [main, ccr-6129213f-424rf3]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

# Read-only by default; only the release job may write (create the pre-release).
permissions:
  contents: read

# Third-party actions are pinned to commits (tags can be moved); the comment names the version.

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, types and unit tests must pass before anything is built.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: |
          pnpm check
          pnpm exec oxlint --type-aware

      - name: Types
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Route React Native's C++ builds through ccache; CMake picks these up.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Paths differ between pnpm store hashes and runs; hash relative to the repo.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Save the Gradle cache on this branch too, not only on the default branch.
          cache-read-only: false

      # Compiled native code is reused between builds (the bulk of the build time).
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: android-native-${{ runner.os }}
          max-size: 2G
          verbose: 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Release build signed with the debug key: fine for testing, not for the Play Store.
      # arm64-v8a runs on practically every phone; x86_64 lets the emulator smoke test run it.
      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
          ccache --show-stats

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ikuzo-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ikuzo-apk
          path: apps/mobile/dist/*.apk

  # Installs the APK on an emulator, opens it and fails if the app does not stay running.
  # The logcat and a screenshot are kept either way, so crashes can be read from the run.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ikuzo-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh apk io.github.roronoazoroo.ikuzo smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ikuzo-apk
          path: dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ikuzo test build ${{ github.run_number }}
          prerelease: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}). It passed an emulator launch test.

            **Install:** download `ikuzo-${{ github.run_number }}.apk` on your Android phone, open it and allow
            installing from your browser when asked. Updates install over the previous build.

            Signed with a debug key: for testing only.
