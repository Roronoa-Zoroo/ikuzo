name: Android APK

# Builds an installable APK and publishes it as a GitHub pre-release,
# so the app can be downloaded straight onto a phone.
on:
  push:
    branches: [main, ccr-6129213f-424rf3]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Route React Native's C++ builds through ccache; CMake picks these up.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Paths differ between pnpm store hashes and runs; hash relative to the repo.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Save the Gradle cache on this branch too, not only on the default branch.
          cache-read-only: false

      # Compiled native code is reused between builds (the bulk of the build time).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-native-${{ runner.os }}
          max-size: 2G
          verbose: 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Release build signed with the debug key: fine for testing, not for the Play Store.
      # arm64-v8a runs on practically every phone; x86_64 lets the emulator smoke test run it.
      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
          ccache --show-stats

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ikuzo-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ikuzo-apk
          path: apps/mobile/dist/*.apk

  # Installs the APK on an emulator, opens it and fails if the app does not stay running.
  # The logcat and a screenshot are kept either way, so crashes can be read from the run.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ikuzo-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh apk io.github.roronoazoroo.ikuzo smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ikuzo-apk
          path: dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ikuzo test build ${{ github.run_number }}
          prerelease: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}). It passed an emulator launch test.

            **Install:** download `ikuzo-${{ github.run_number }}.apk` on your Android phone, open it and allow
            installing from your browser when asked. Updates install over the previous build.

            Signed with a debug key: for testing only.
