name: Android APK

# Builds an installable APK and publishes it as a GitHub pre-release,
# so the app can be downloaded straight onto a phone.
on:
  push:
    branches: [main, ccr-6129213f-424rf3]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Release build signed with the debug key: fine for testing, not for the Play Store.
      # arm64-v8a only covers practically every phone from the last 7+ years and halves build time.
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ikuzo-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ikuzo-apk
          path: apps/mobile/dist/*.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ikuzo test build ${{ github.run_number }}
          prerelease: true
          files: apps/mobile/dist/*.apk
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}).

            **Install:** download `ikuzo-${{ github.run_number }}.apk` on your Android phone, open it and allow
            installing from your browser when asked. Updates install over the previous build.

            Signed with a debug key: for testing only.
